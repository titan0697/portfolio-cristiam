<section class="contact-container">
    <header class="contact-header">
        <span class="section-label">Conectemos</span>
        <h2>¿Tienes un proyecto en mente?</h2>
    </header>

    <div class="contact-glass-panel">
        <div class="contact-info">
            <div class="info-item">
                <span class="icon">✉</span>
                <div class="details">
                    <label>Email</label>
                    <a href="mailto:tu-email@ejemplo.com">cristiam.dev@ejemplo.com</a>
                </div>
            </div>

            <div class="info-item">
                <span class="icon">📍</span>
                <div class="details">
                    <label>Ubicación</label>
                    <p>San José, Costa Rica</p>
                </div>
            </div>

            <div class="social-links">
                <a href="#" class="social-btn">LinkedIn</a>
                <a href="#" class="social-btn">GitHub</a>
            </div>
        </div>

        <form class="contact-form">
            <div class="input-group">
                <input type="text" placeholder="Tu Nombre" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Tu Email" required>
            </div>
            <div class="input-group">
                <textarea placeholder="Cuéntame sobre tu proyecto" rows="4"></textarea>
            </div>
            <button type="submit" class="submit-btn">
                Enviar Mensaje
                <span class="arrow">→</span>
            </button>
        </form>
    </div>
</section>
