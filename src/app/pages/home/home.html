<section class="bento-container">
    <div class="bento-item hero">
        <div class="content">
            <span class="initials">Cristiam Salazar Barquero</span>
            <h1>Software Engineer</h1>
            <!-- <p>Frontend Engineer & UI Designer</p> -->
        </div>
        <div class="blob-bg"></div>
    </div>

    <div *ngFor="let item of nodes" class="bento-item card" [ngClass]="item.id">
        <div class="card-content">
            <span class="label">{{item.label}}</span>
            <div class="arrow">↗</div>
        </div>
        <div class="hover-overlay"></div>
    </div>
</section>
