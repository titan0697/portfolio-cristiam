<section class="projects-section">
    <div class="container">
        <header class="projects-header">
            <span class="section-label">{{ t('projectsLabel') }}</span>
            <h2>{{ t('projectsTitle') }}</h2>
        </header>

        <div class="projects-grid">
            <div class="project-card" *ngFor="let project of projectList; let i = index">
                <div class="card-image">
                    <img [src]="project.img" [alt]="project.title[language()]" />
                    <div class="image-overlay">
                        <span class="project-number">0{{i + 1}}</span>
                    </div>
                </div>
                <div class="card-content">
                    <span class="year">{{ project.year }}</span>
                    <h3>{{ project.title[language()] }}</h3>
                    <p>{{ project.description[language()] }}</p>
                    <div class="tech-tags">
                        <span *ngFor="let tech of project.stack" class="tag">{{ tech }}</span>
                    </div>
                    <a href="#" class="view-project-btn">{{ t('projectExplore') }}</a>
                </div>
            </div>
        </div>
    </div>
</section>
