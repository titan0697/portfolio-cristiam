<section class="projects-container">
    <header class="projects-header">
        <span class="section-label">Recorrido</span>
        <h2>Algunos de mis desarrollos</h2>
    </header>

    <div class="projects-stack">
        <div class="project-card" *ngFor="let project of projectList; let i = index" [style.--index]="i">
            <div class="card-inner">
                <div class="card-front">
                    <img [src]="project.img" [alt]="project.title" />
                    <div class="front-overlay">
                        <span class="project-number">0{{i + 1}}</span>
                        <h3>{{project.title}}</h3>
                    </div>
                </div>

                <div class="card-back">
                    <div class="back-content">
                        <span class="year">{{project.year}}</span>
                        <h4>{{project.title}}</h4>
                        <p>{{project.description}}</p>
                        <div class="tech-tags">
                            <span *ngFor="let tech of project.stack">{{tech}}</span>
                        </div>
                        <a href="#" class="view-project-btn">Explore ↗</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
